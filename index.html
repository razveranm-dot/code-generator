<!DOCTYPE html>
<html>
<head>
  <title>Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Code Generator</h1>

  <!-- Client code input -->
  <label for="clientCode">Client Code:</label>
  <input type="text" id="clientCode" placeholder="Default = RSS">

  <!-- Name input -->
  <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Enter your name">

  <!-- Buttons -->
  <button onclick="generateCode('PV')">Generate PV</button>
  <button onclick="generateCode('INV')">Generate INV</button>
  <button onclick="generateCode('QT')">Generate QT</button>
  <button onclick="generateCode('PO')">Generate PO</button>

  <div id="output"></div>

  <h2>Last 10 Codes</h2>

  <!-- Filter controls -->
  <label for="filterType">Filter by Type:</label>
  <select id="filterType" onchange="loadHistory()">
    <option value="">All</option>
    <option value="PV">PV</option>
    <option value="INV">INV</option>
    <option value="QT">QT</option>
    <option value="PO">PO</option>
  </select>

  <label for="filterClient">Filter by Client Code:</label>
  <input type="text" id="filterClient" placeholder="Enter client code">

  <button onclick="loadHistory()">Apply Filter</button>
  <button onclick="downloadCSV()">Download CSV</button>

  <table id="historyTable">
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Date</th>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
