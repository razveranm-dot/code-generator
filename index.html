<!DOCTYPE html>
<html>
<head>
  <title>Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Generate Codes</h2>

  <div class="box">
    <h3>Purchase Voucher (PV)</h3>
    <input type="text" id="pvName" placeholder="Enter name">
    <select id="pvClient">
      <option value="RSSB">DEFAULT - RSSB</option>
      <option value="PETRONAS">PETRONAS</option>
    </select>
    <button onclick="generateCode('PV')">Generate PV</button>
    <p id="pvResult" class="feedback"></p>
  </div>

  <div class="box">
    <h3>Invoice (INV)</h3>
    <input type="text" id="invName" placeholder="Enter name">
    <button onclick="generateCode('INV')">Generate INV</button>
    <p id="invResult" class="feedback"></p>
  </div>

  <div class="box">
    <h3>Quotation (QT)</h3>
    <input type="text" id="qtName" placeholder="Enter name">
    <select id="qtClient">
      <option value="RSSB">DEFAULT - RSSB</option>
      <option value="PETRONAS">PETRONAS</option>
    </select>
    <button onclick="generateCode('QT')">Generate QT</button>
    <p id="qtResult" class="feedback"></p>
  </div>

  <div class="box">
    <h3>Dashboard</h3>
    <label>Type:</label>
    <select id="dashType">
      <option value="PV">PV</option>
      <option value="INV">INV</option>
      <option value="QT">QT</option>
    </select>
    
    <label>Client Code:</label>
    <select id="dashClient">
      <option value="">All</option>
      <option value="RSSB">RSSB</option>
      <option value="PETRONAS">PETRONAS</option>
    </select>
    
    <label>Date:</label>
    <input type="date" id="dashDate">
    
    <button onclick="loadDashboard()">Search</button>
    <button onclick="exportCSV()">Export CSV</button>
    
    <table border="1" id="dashboardTable" style="margin-top:10px; width:100%;">
      <thead>
        <tr><th>Code</th><th>Name</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
