<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Code Generator</h1>

  <!-- PV Section -->
  <div>
    <h2>Purchase Voucher (PV)</h2>
    <input type="text" id="pvName" placeholder="Enter Name here">
    <select id="pvClient">
      <option value="RSSB">RSSB</option>
      <option value="CLIENT">CLIENT</option>
    </select>
    <button onclick="generateCode('PV')">Generate PV</button>
    <p id="pvResult"></p>
  </div>

  <!-- INV Section -->
  <div>
    <h2>Invoice (INV)</h2>
    <input type="text" id="invName" placeholder="Enter Name here">
    <button onclick="generateCode('INV')">Generate INV</button>
    <p id="invResult"></p>
  </div>

  <!-- QT Section -->
  <div>
    <h2>Quotation (QT)</h2>
    <input type="text" id="qtName" placeholder="Enter Name here">
    <select id="qtClient">
      <option value="RSSB">RSSB</option>
      <option value="CLIENT">CLIENT</option>
    </select>
    <button onclick="generateCode('QT')">Generate QT</button>
    <p id="qtResult"></p>
  </div>

  <!-- Dashboard -->
  <h2>Dashboard</h2>
  <select id="filterType">
    <option value="">All Types</option>
    <option value="PV">PV</option>
    <option value="INV">INV</option>
    <option value="QT">QT</option>
  </select>
  <select id="filterClient">
    <option value="">All Clients</option>
    <option value="RSSB">RSSB</option>
    <option value="CLIENT">CLIENT</option>
  </select>
  <input type="date" id="filterDate">
  <button onclick="searchCodes()">Search</button>
  <button onclick="exportCSV()">Export CSV</button>

  <table border="1" id="resultsTable">
    <thead>
      <tr><th>Code</th><th>Name</th><th>Date</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
